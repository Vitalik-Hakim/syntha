[project]
name = "syntha-ingestion"
version = "0.0.0"
description = "Syntha Gamma / CLOB / Data API pullers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "syntha-contracts",
  "syntha-storage",
]

[tool.uv.sources]
syntha-contracts = { workspace = true }
syntha-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
