[project]
name = "syntha-ingestion"
version = "0.0.0"
description = "Syntha Gamma / CLOB / Data API pullers and the raw → normalized rebuild"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "syntha-contracts",
  "syntha-storage",
]

[project.scripts]
syntha-ingest = "syntha_ingestion.cli:main"

[tool.uv.sources]
syntha-contracts = { workspace = true }
syntha-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
