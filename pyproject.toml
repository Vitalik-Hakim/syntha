[project]
name = "syntha"
version = "0.0.0"
description = "Syntha — honest backtesting for Polymarket strategies (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "syntha-api",
  "syntha-contracts",
  "syntha-engine",
  "syntha-ingestion",
  "syntha-recorder",
  "syntha-storage",
  "syntha-worker",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "hypothesis>=6.100",
  "matplotlib>=3.11.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pyyaml>=6.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/*", "services/*"]

[tool.uv.sources]
syntha-api = { workspace = true }
syntha-contracts = { workspace = true }
syntha-engine = { workspace = true }
syntha-ingestion = { workspace = true }
syntha-recorder = { workspace = true }
syntha-storage = { workspace = true }
syntha-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Line length is enforced by `ruff format` for code; long SQL string literals are fine.
ignore = [
  "E501",
  # Mathematical symbols (−, ×, ≥, Σ) are used deliberately in formulas and docs.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["syntha_*", "check_engine_io", "gen_schemas", "m1_acceptance"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["rq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
pythonpath = ["tools"]
testpaths = [
  "apps/api/tests",
  "packages/contracts/tests",
  "packages/engine/tests",
  "packages/storage/tests",
  "services/ingestion/tests",
  "services/recorder/tests",
  "services/worker/tests",
  "tools/tests",
]
