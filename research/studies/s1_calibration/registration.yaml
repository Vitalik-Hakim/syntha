# PRD v3 §7.6 registration — S1, executable calibration surface (§5.1).
# Committed before any census observation exists. Changing anything below after data is seen
# is a new registration with its own register rows; this file is not edited.
study: s1_calibration
title: Executable calibration surface
registered_at: 2026-09-15T00:00:00Z
registered_by: Claude Code (agent) on behalf of Vitalik Hakim
data_seen_before_registration:
  - "march..july-2026-liquid-400 (M6/M7) and february/august-2026-liquid-400 (stage 3): 1-minute bars, prints and the 44 rule configurations of docs/RESEARCH_PROTOCOL.md; verdict: no edge"
  - "Appendix B probes on 2026-09-15 (docs/DATA_NOTES.md, 'M9 prep'): Gamma listing pages for July 2025, hourly and 1-minute price history of one June-2025 market, 12,000 prints of one July-2025 Fed market, 20 resolution rows, one wallet's trades/activity/positions. No calibration statistic was computed from any of it."
  - "No census month has been sampled, fetched, built or analysed."
discovery_set:
  D_2025: [2025-07, 2025-08, 2025-09, 2025-10, 2025-11, 2025-12]   # never touched
  D_2026: [2026-02, 2026-03, 2026-04, 2026-05]                       # fresh census samples of months whose 400-market samples M7 used; disclosed
confirmation_sets:
  C1: [2026-06, 2026-07, 2026-08]   # fresh samples of months used as M6/M7 holdouts; disclosed
  C2: [2026-01, 2026-09, 2026-10]   # untouched; 2026-10 fetched once its markets resolve (mid-November)
estimand: >
  Per token-observation of the census (§4.1), the executable return
  r = (payout − fill_10m − fee_entry_current) / fill_10m under CURRENT fees, averaged per cell;
  cluster-bootstrapped by event_id and by UTC day, the wider 90% interval is the headline.
  Alongside: mid calibration E[payout − mid], fill rate (share of observations with fill_10m),
  and capacity at $1,000 and $10,000.
primary_cells: category x price_bucket x offset   # count written by register.py
cell_dimensions:
  category: [sports, crypto, politics, geopolitics, finance, economics, culture, weather, tech, mentions, other]
  price_bucket: ["[0.01,0.03)", "[0.03,0.10)", "[0.10,0.20)", "[0.20,0.35)", "[0.35,0.50)", "[0.50,0.65)", "[0.65,0.80)", "[0.80,0.90)", "[0.90,0.97)", "[0.97,0.99]"]
  offset: ["-7d", "-3d", "-24h", "-6h", "-1h", "-15m"]
price_bucket_is_on: fill_10m (the executable price), not mid
secondary_stratifications:
  - liquidity tier (liq_24h terciles within the month; the null tier — prints truncated or window uncovered — reported separately)
  - deadline_type (BY | ON | NONE; S2 test 1 lives here)
  - structure (binary | sibling)
  - duration_class (intraday | multi_day | long)
  - open-relative offsets +1h and +24h (reported, not primary)
exclusions:
  - "ultra_short markets are measured and reported, never pooled into primary cells (5/15-minute crypto: a latency game with its own fee curve)"
  - "observations without fill_10m count for mid calibration and the fill rate only"
  - "liquidity tiers are null where the print walk did not cover the window; never imputed"
  - "a month enters D only if its census build passed acceptance (manifest, resumable fetch, bit-identical rebuild)"
selection_rule: |
  A cell is a candidate if all of:
  - E[r] under CURRENT fees > 0 and the wider cluster 90% CI is above zero;
  - n >= 500 token-observations with fill_10m;
  - fill rate >= 0.30;
  - the sign of E[r] is positive in >= 4 of 6 months of 2025 H2 and in >= 3 of 4 of 2026 Feb–May;
  - it survives Benjamini–Hochberg at 10% FDR across every primary cell tested, N being the
    register's count of s1_calibration:cells rows.
  At most 8 candidates, ordered by E[r] x capacity at $1,000.
underpowered_rule: cells with fewer than 300 observations are reported as underpowered with their MDE@80% (2.48 x cluster SE) and are never selected
confirmation_rule: >
  PRD v3 §6.2 (docs/RESEARCH_PROTOCOL.md, Stage 4). Each candidate becomes a DSL strategy —
  universe = the cell's category, entry = price inside the bucket during the offset window,
  hold to settlement, LIMIT +1 tick, TTL 5 bars, 2% of starting capital, max_positions_per_event 1 —
  and runs through the engine on C1, then C2, Realistic and Conservative, with the permutation test.
  Verdict vocabulary: confirmed / promising-unconfirmed / rejected / underpowered.
frozen_parameters:
  limit_offset_ticks: 1
  ttl_bars: 5
  sizing: 2% of starting capital, max_positions_per_event 1
  participation: 0.10
  fill_windows_minutes: [10, 30]      # fill_10m decides; fill_30m reported
  fill_limit: mid + 1 tick
  price_window_days: 15               # CLOB cap at fidelity 60, verified
  fine_window_hours: 6                # fidelity 1, intraday and ultra_short only
  print_depth_days: 8
  print_pages_max: 10
  per_stratum: 2000
  ultra_short_cap: 500
  census_seed: "YYYYMM01 as an integer (2025-07 → 20250701)"
  current_fee: "the category's latest fee schedule; categories without a schedule pay 0"
what_would_kill_it: |
  fill rate < 30% in the candidate cells; sign flips between 2025 H2 and 2026;
  an effect present under HISTORICAL but absent under CURRENT fees;
  failure on C1 or C2 under §6.2;
  census coverage below 80% of sampled markets with a mid at -24h in any discovery month.
probe_findings_relied_on: >
  docs/DATA_NOTES.md "M9 prep" (2026-09-15): hourly price history is retrievable for 2025 markets
  with a 15-day window cap; /v2/trades depth is unbounded (12 pages verified on the busiest July-2025
  market), hence the 8-day / 10-page stop rule; 2025 markets carry no feeType, so category comes
  from event tags; resolutions for July 2025 arrived in the `price` shape.
outputs:
  - research/studies/s1_calibration/calibration.parquet
  - heatmaps per offset (E[r], fill rate, n)
  - candidate list, or "none"
  - negative-space table: every stratum with its MDE@80%
  - register N and the best-of-N null from stored permutation variants
